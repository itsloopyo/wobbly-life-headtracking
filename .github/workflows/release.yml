name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    uses: itsloopyo/cameraunlock-core/.github/workflows/release-bepinex-mod.yml@main
    with:
      csproj-path: src/WobblyLifeHeadTracking/WobblyLifeHeadTracking.csproj
      project-name: "Head Tracking for Wobbly Life"
      build-output-dir: src/WobblyLifeHeadTracking/bin/Release/net472
      mod-name: WobblyLifeHeadTracking
      mod-dlls: "WobblyLifeHeadTracking.dll CameraUnlock.Core.dll CameraUnlock.Core.Unity.dll CameraUnlock.Core.Unity.BepInEx.dll"
      artifact-paths: "src/WobblyLifeHeadTracking/ cameraunlock-core scripts/install.cmd scripts/uninstall.cmd"
      prebuilt-dir: prebuilt
      create-nexus-zip: "true"
    permissions:
      contents: write
